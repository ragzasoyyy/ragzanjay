<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>TikTok Downloader — Hybrid Scraper</title>
<style>
  :root{--bg:#0b1020;--card:#0f1724;--accent:#00f5d4;--muted:#94a3b8}
  body{margin:0;background:var(--bg);color:#e6eef8;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial}
  .wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px}
  .card{width:100%;max-width:760px;background:linear-gradient(180deg,rgba(255,255,255,0.02),rgba(255,255,255,0.01));padding:28px;border-radius:12px;box-shadow:0 8px 30px rgba(2,6,23,0.6)}
  h1{margin:0 0 8px;font-size:20px}
  p.sub{margin:0 0 18px;color:var(--muted)}
  .row{display:flex;gap:8px}
  input[type="text"]{flex:1;padding:12px;border-radius:8px;border:1px solid rgba(255,255,255,0.04);background:transparent;color:inherit;outline:none}
  button{padding:11px 14px;border-radius:8px;border:none;background:var(--accent);color:#001;cursor:pointer;font-weight:700}
  .result{margin-top:18px;background:#071125;padding:14px;border-radius:10px;display:none}
  video{width:100%;border-radius:8px;margin-top:8px}
  .meta{display:flex;gap:12px;align-items:center;margin-top:8px}
  .thumb{width:72px;height:72px;background:#000;border-radius:8px;overflow:hidden}
  .thumb img{width:100%;height:100%;object-fit:cover}
  a.download{display:inline-block;margin-top:10px;padding:10px 12px;border-radius:8px;background:var(--accent);color:#001;text-decoration:none;font-weight:700}
  .error{color:#ff8b8b}
  pre.debug{max-height:200px;overflow:auto;background:#051122;padding:10px;border-radius:6px;color:#9fb6d3}
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>TikTok Downloader — Hybrid Scraper</h1>
      <p class="sub">Masukkan link TikTok, klik Download. Hasil diambil langsung dari halaman TikTok (heuristik).</p>

      <div class="row">
        <input id="url" placeholder="Contoh: https://vt.tiktok.com/..." />
        <button id="btn">Download</button>
      </div>

      <div id="result" class="result">
        <div id="status">Memproses...</div>
        <div id="meta" style="display:none">
          <div class="meta">
            <div class="thumb"><img id="cover" src="" alt="cover" /></div>
            <div>
              <div id="desc" style="font-weight:700"></div>
              <div id="author" style="color:var(--muted);font-size:13px"></div>
            </div>
          </div>
          <video id="player" controls></video>
          <a id="dl" class="download" target="_blank" rel="noopener">⬇️ Download Video</a>
          <pre id="dbg" class="debug" style="display:none"></pre>
        </div>
      </div>
    </div>
  </div>

<script>
document.getElementById("btn").addEventListener("click", async () => {
  const url = document.getElementById("url").value.trim();
  const result = document.getElementById("result");
  const status = document.getElementById("status");
  const meta = document.getElementById("meta");
  const cover = document.getElementById("cover");
  const desc = document.getElementById("desc");
  const author = document.getElementById("author");
  const player = document.getElementById("player");
  const dl = document.getElementById("dl");
  const dbg = document.getElementById("dbg");

  meta.style.display = "none";
  dbg.style.display = "none";
  result.style.display = "block";
  status.textContent = "⏳ Memproses: " + url;

  try {
    const res = await fetch(`/api/tiktok?url=${encodeURIComponent(url)}`);
    const data = await res.json();
    if (!data.status) {
      status.innerHTML = '❌ Gagal: <span class="error">' + (data.error || 'Unknown') + "</span>";
      if (data.debug) {
        dbg.style.display = "block";
        dbg.textContent = JSON.stringify(data.debug, null, 2);
      }
      return;
    }

    status.textContent = "✅ Sukses";
    meta.style.display = "block";
    if (data.cover) cover.src = data.cover;
    desc.textContent = data.desc || "(tanpa deskripsi)";
    author.textContent = data.author || "";
    player.src = data.video;
    dl.href = data.video;
    dl.textContent = "⬇️ Download Video";
    if (data.debug) {
      dbg.style.display = "block";
      dbg.textContent = JSON.stringify(data.debug, null, 2);
    }
  } catch (e) {
    status.innerHTML = '⚠️ Error: ' + e.message;
  }
});
</script>
</body>
</html>
